[workspace]
members = [
    "programs/*",
]
resolver = "2"

[workspace.dependencies]

[profile.release]
overflow-checks = true

[package]
name = "anchor-escrow-tests"
version = "0.1.0"
edition = "2021"

[[test]]
name = "anchor-litesvm-tests"
path = "tests/anchor-litesvm-tests.rs"

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
solana-hash = { version = "3.0.0", features = ["serde"] }
[dev-dependencies]
litesvm = "0.18"
litesvm-token = "0.18"
anchor-litesvm = "0.4"
litesvm-utils = "0.4"
solana-sdk = "3"
spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"
